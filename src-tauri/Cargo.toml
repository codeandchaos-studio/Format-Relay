[package]
name = "format-relay"
version = "0.1.0"
description = "A local-first desktop file conversion and utility suite by Code & Chaos."
authors = ["Code & Chaos Studio"]
edition = "2021"
license = "LicenseRef-Code-And-Chaos-View-Only"

[lib]
name = "format_relay_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.1"
tauri-plugin-fs = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
lopdf = "0.46"
miniz_oxide = "0.8"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
